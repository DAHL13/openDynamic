name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Package and Release
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore openDynamic.sln

    - name: Build solution (Release - TreatWarningsAsErrors)
      run: dotnet build openDynamic.sln -c Release --no-restore

    - name: Run unit test suite
      run: dotnet test openDynamic.sln -c Release --no-build --verbosity normal

    - name: Publish OpenDynamic.App (ReadyToRun)
      run: >
        dotnet publish src/OpenDynamic.App/OpenDynamic.App.csproj
        -c Release
        -r win-x64
        --self-contained false
        -p:PublishReadyToRun=true
        -p:DebugType=none
        -p:DebugSymbols=false
        -o publish

    - name: Prepare distribution files and package portable ZIP
      shell: pwsh
      run: |
        Remove-Item -Path publish\*.pdb -Force -ErrorAction SilentlyContinue
        Copy-Item -Path README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination publish\ -Force
        Compress-Archive -Path publish\* -DestinationPath openDynamic-portable-win-x64.zip -Force

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --no-progress
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Build Inno Setup Installer
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppSourcePath="${{ github.workspace }}\publish" installer\setup.iss

    - name: Generate SHA256SUMS.txt
      shell: pwsh
      run: |
        $artifacts = @(
          "installer\Output\openDynamic-setup.exe",
          "openDynamic-portable-win-x64.zip"
        )
        $lines = foreach ($file in $artifacts) {
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Path $file -Leaf
          "$hash  $name"
        }
        $lines | Set-Content -Path SHA256SUMS.txt -Encoding utf8

    - name: Create GitHub Release (Draft) and Upload Artifacts
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        body_path: docs/release-notes-2.0.0.md
        files: |
          installer/Output/openDynamic-setup.exe
          openDynamic-portable-win-x64.zip
          SHA256SUMS.txt
        generate_release_notes: true
