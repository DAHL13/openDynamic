name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore openDynamic.sln

    - name: Build
      run: dotnet build openDynamic.sln -c Release --no-restore

    - name: Test
      run: dotnet test openDynamic.sln -c Release --no-build --verbosity normal
