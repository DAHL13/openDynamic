name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore openDynamic.sln

    - name: Verify code formatting (.editorconfig)
      run: dotnet format openDynamic.sln --verify-no-changes --no-restore

    - name: Build
      run: dotnet build openDynamic.sln -c Release --no-restore

    - name: Test
      run: dotnet test openDynamic.sln -c Release --no-build --verbosity normal

    - name: Verify no Antigravity remnants in src and tests
      shell: pwsh
      run: |
        $remnants = git grep -n -i -E "antigravity|AgentApproval|OpenDynamic\.Hook|approval-rules|openDynamic-agent|hooks\.json" -- src/ tests/
        if ($LASTEXITCODE -eq 0 -or $remnants) {
          Write-Error "Found Antigravity remnants in src/ or tests/:`n$remnants"
          exit 1
        }
        if ($LASTEXITCODE -gt 1) {
          Write-Error "git grep failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        Write-Host "Verified: 0 Antigravity remnants found in src/ and tests/."
        exit 0
