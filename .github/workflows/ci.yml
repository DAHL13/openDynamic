name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore openDynamic.sln

    - name: Build
      run: dotnet build openDynamic.sln -c Release --no-restore

    - name: Test
      run: dotnet test openDynamic.sln -c Release --no-build --verbosity normal

    - name: Verify no Antigravity remnants in src and tests
      shell: pwsh
      run: |
        $matches = git grep -n -i -E "antigravity|AgentApproval|OpenDynamic\.Hook|approval-rules|openDynamic-agent|hooks\.json" -- src/ tests/
        if ($matches) {
          Write-Error "Found Antigravity remnants in src/ or tests/:`n$matches"
          exit 1
        }
